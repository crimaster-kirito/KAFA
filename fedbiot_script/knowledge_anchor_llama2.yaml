use_gpu: True
device: 0
early_stop:
  patience: 0

federate:
  mode: standalone
  client_num: 3  # 固定3个客户端
  total_round_num: 100
  save_to: "checkpoints/knowledge_anchor_llama2.ckpt"
  save_freq: 20
  share_local_model: True
  online_aggr: False
  method: "knowledgeanchor"  # 使用知识锚点方法（会自动选择knowledge_anchor聚合器）

data:
  root: data/
  type: 'gsm8k@llm'  # 任务相关数据集
  splits: [0.4, 0.4, 0.2]  # 40%服务器，40%客户端，20%测试
  splitter: 'knowledge_anchor'  # 使用知识锚点数据分配器
  splitter_args:
    - server_ratio: 0.4
      client_ratio: 0.4
      test_ratio: 0.2
      non_iid_alpha: 0.5  # Dirichlet参数，控制non-IID程度（越小越non-IID）
      task_irrelevant_ratio: 0.1  # 任务不相关数据比例（10%）
      irrelevant_dataset: 'imdb'  # 使用IMDB数据集作为无关样本源（情感分类任务）

llm:
  grad_accum_step: 8  # 增加梯度累积步数以补偿小的batch size
  tok_len: 512  # 减少序列长度以节省内存
  chat:
    max_len: 1000
  adapter:
    use: True
    mv_to_cpu: True  # 训练后将adapter移到CPU以节省GPU内存
    args: 
      - adapter_package: 'peft'
        adapter_method: 'lora'
        r: 8
        lora_alpha: 16
        lora_dropout: 0.05
  knowledge_anchor:
    # 服务器端配置
    num_instructions: 10  # 生成的指令数量
    num_prototypes: 50  # 原型库大小
    intermediate_layer: 16  # 提取隐藏状态的层（16表示第16层，支持负数索引）
    generation_temperature: 0.7  # 指令生成温度
    max_new_tokens: 256  # 生成最大token数
    train_on_server: True  # 是否在服务器端数据上微调
    
    # 客户端配置
    client_model_type: '/home/tyx/ywp/FedBiOT/models/tinyllama-1.1b-chat-v1.0@huggingface_llm'  # 客户端小模型（本地路径）
    task_relevance_threshold: 0.5  # 任务相关性阈值（余弦相似度）
    prototype_alignment_weight: 0.3  # 原型对齐损失权重
    use_instruction_augmentation: True  # 是否使用指令增强
    
    # LoRA映射配置
    lora_mapping_strategy: 'interpolate'  # 'direct', 'many_to_one', 'interpolate'
    max_prototypes: 100  # 最大原型数量（超过后重新聚类）

dataloader:
  batch_size: 1  # 减少batch size以节省内存

model:
  # 服务器端模型：Llama-7B
  type: '/home/tyx/ywp/FedBiOT/models/llama-2-7b-hf@huggingface_llm'
  # 客户端模型：DistilLlama（需要在代码中指定）
  # client_model_type: 'distilgpt2@huggingface_llm'  # 示例，需要根据实际模型调整

train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.001
    betas: (0.9, 0.95)
  is_enable_half: True

criterion:
  type: CrossEntropyLoss

trainer:
  type: knowledge_anchor_client  # 使用知识锚点客户端trainer

eval:
  freq: 20
  metrics: ['loss']
  best_res_update_round_wise_key: 'test_loss'
  report: ['weighted_avg', 'avg', 'raw']
  count_flops: False

expname: "knowledge_anchor_llama2"

