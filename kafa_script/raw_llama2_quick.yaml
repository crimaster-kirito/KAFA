use_gpu: True
device: 0
seed: 42

federate:
  mode: standalone
  client_num: 3
  total_round_num: 30
  share_local_model: True
  online_aggr: False

data:
  root: data/
  type: 'gsm8k@llm'
  splits: [0.4, 0.4, 0.2]
  splitter: 'iid'

llm:
  grad_accum_step: 4
  tok_len: 512
  chat:
    max_len: 1000
  adapter:
    use: True
    args:
      - adapter_package: 'peft'
        adapter_method: 'lora'
        r: 8
        lora_alpha: 16
        lora_dropout: 0.05
  offsite_tuning:
    use: False

dataloader:
  batch_size: 1

model:
  type: 'models/llama-2-7b-hf@huggingface_llm'

train:
  local_update_steps: 10
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.001
    betas: (0.9, 0.95)
  is_enable_half: True

criterion:
  type: CrossEntropyLoss

trainer:
  type: llmtrainer

eval:
  freq: 5
  metrics: ['loss']
  best_res_update_round_wise_key: 'test_loss'
  report: ['weighted_avg', 'avg', 'raw']
  count_flops: False

expname: 'raw_llama2_quick'
