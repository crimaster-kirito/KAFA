use_gpu: True
device: 0
early_stop:
  patience: 0
federate:
  aggregator_type: 'knowledge_anchor'  # 注册你的 aggregator
  use_anchor: True
  anchor_outlier_threshold: 2.0

data:
  root: data/
  type: 'gsm8k@llm'
  splits: [0.998,0.001,0.001]
  splitter: 'iid'

llm:
  grad_accum_step: 4
  tok_len: 800
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  offsite_tuning:
    use: True
    save_full_model: True
    emu_l: 0
    emu_r: 30
    strategy: 'drop_layer'
    kwargs: [ { 'drop_ratio': 0.5 }]
    emu_align:
      use: True
      initial_only: False
      sim_loss: 'l2'
      layerwise_distill: False
      kl_divergence: 'raw'
      train:
        local_update_steps: 5
        initial_update_rounds: 100
        lm_loss_weight: 1.0
        kd_loss_weight: 0.0
dataloader:
  batch_size: 4
model:
  #type: 'meta-llama/Llama-2-7b-hf@huggingface_llm'
  type: '/home/tyx/ywp/FedBiOT/models/llama-2-7b-hf@huggingface_llm'

train:
  use_lora: True
  lora_rank: 8
  anchor_lambda: 0.5  # 蒸馏损失权重
  temp: 2.0  # 软化温度

criterion:
  type: CrossEntropyLoss
trainer:
  type: llmtrainer
eval:
  freq: 100
  metrics: ['loss']
  best_res_update_round_wise_key: 'test_loss'
  report: ['weighted_avg', 'avg', 'raw']
  count_flops: False

expname: "KAFA_llama2"

privacy:
  use_dp: True
  noise_std: 0.01  # 差分隐私噪声

